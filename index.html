<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>경비요도 제작</title>
<style>
  :root{
    --bg:#0E1420; --panel:#16202F; --panel2:#1C2940; --line:#26354E;
    --text:#DFE7F3; --sub:#8FA0B8; --blue:#3B7BFF; --yellow:#FFD023;
    --red:#FF5A5F; --green:#37D3A0;
    --mono:'SF Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    height:100vh;height:100dvh;
    font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }

  /* ── 헤더 ─────────────────────────── */
  header{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
    flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  }
  header::-webkit-scrollbar{display:none}
  .brand{display:flex;align-items:center;gap:8px;margin-right:6px;flex:none}
  .badge{
    width:26px;height:26px;border-radius:6px;flex:none;
    background:repeating-linear-gradient(135deg,var(--yellow) 0 6px,#111 6px 12px);
    border:1px solid #000;
  }
  .brand b{font-size:14px;letter-spacing:.06em;white-space:nowrap}
  .brand small{display:block;font-size:10px;color:var(--sub);letter-spacing:.14em}
  .hbtn{
    flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .hbtn:active{transform:translateY(1px)}
  .hbtn.warn{color:var(--red);border-color:#5a2a30}
  .hbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .hbtn:disabled{opacity:.35;cursor:default}
  .seg{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--sub);padding:7px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--blue);color:#fff;font-weight:600}
  .hproj{
    flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 10px;font-size:12px;width:132px;
  }
  .hproj::placeholder{color:var(--sub)}
  input,textarea,select{-webkit-user-select:text;user-select:text}

  /* 크기·두께 조절 */
  .sizectl{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:10px;color:var(--sub);flex:none;padding:6px 0;
  }
  .sizectl input[type=range]{width:66px;accent-color:var(--yellow)}
  #sizeVal,#geoAlphaVal{font-family:var(--mono);color:var(--text);font-size:11px}

  /* ── 본문 ─────────────────────────── */
  #main{flex:1;display:flex;min-height:0;position:relative}
  #stage{flex:1;position:relative;min-width:0}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1B222D}

  /* ── 도구 레일 ─────────────────────── */
  #tools{
    display:flex;flex-direction:column;gap:6px;padding:10px 8px;
    background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;width:86px;flex:none;scrollbar-width:none;
  }
  #tools::-webkit-scrollbar{display:none}
  .tool{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:10px;padding:8px 4px;font-size:11px;cursor:pointer;flex:none;
  }
  .tool .ic{font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .tool .ic svg{display:block}
  .tool.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .tdiv{height:1px;background:var(--line);margin:4px 2px;flex:none}
  .palette{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:2px 0;flex:none}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff}

  /* ── 상태 카드 ─────────────────────── */
  #status{
    position:absolute;right:10px;top:10px;z-index:5;
    background:rgba(14,20,32,.88);backdrop-filter:blur(4px);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:var(--mono);font-size:11px;line-height:1.9;color:var(--sub);
    pointer-events:none;min-width:150px;
  }
  #status b{color:var(--text);font-weight:600}
  #status .yl{color:var(--yellow)} #status .bl{color:var(--blue)} #status .rd{color:var(--red)}

  /* 플로팅 버튼/배너 */
  #finishBar,#selBar{
    position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:6;
    display:none;gap:8px;
  }
  #finishBar button,#selBar button{
    border:0;border-radius:20px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #finishDone{background:var(--yellow);color:#111}
  #finishCancel{background:var(--panel2);color:var(--text);border:1px solid var(--line)!important}
  #selDelete{background:var(--red);color:#fff}
  #selRename{background:var(--panel2);color:var(--text);border:1px solid var(--line)!important}
  #banner{
    position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;display:none;
    background:#1c2f48;border:1px solid #3b7bff;color:#dfe7f3;border-radius:8px;
    padding:9px 16px;font-size:12px;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  #hint{
    position:absolute;left:10px;bottom:10px;z-index:5;pointer-events:none;
    font-size:11px;color:var(--sub);background:rgba(14,20,32,.75);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:60%;
  }

  /* 텍스트 입력창 */
  #txtBox{position:absolute;z-index:8;display:none}
  #txtBox textarea{
    display:block;margin:0;padding:2px 4px;
    background:transparent;border:0;outline:none;resize:none;overflow:hidden;
    font-family:inherit;font-weight:bold;line-height:1.25;
    min-width:24px;white-space:pre;border-radius:4px;
    box-shadow:0 0 0 1.5px rgba(55,211,160,.9);
  }

  /* ── 모바일 ────────────────────────── */
  @media (max-width:720px), (pointer:coarse) and (max-width:1024px){
    header{padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right))}
    .hbtn,.seg button{padding:10px 12px;font-size:13px}
    #main{flex-direction:column}
    #tools{
      order:2;width:100%;height:auto;
      border-right:0;border-top:1px solid var(--line);
      display:grid;grid-template-rows:repeat(2, auto);grid-auto-flow:column;grid-auto-columns:min-content;
      align-items:stretch;
      overflow-x:auto;overflow-y:hidden;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .tool{min-width:64px;padding:10px 6px;font-size:12px}
    .tool .ic{font-size:21px}
    .tdiv{width:1px;height:auto;grid-row:span 2;align-self:stretch;margin:2px 4px}
    .palette{grid-row:span 2;align-self:center;flex-wrap:wrap;align-content:center;gap:6px;max-width:64px}
    .sw{width:26px;height:26px}
    .sizectl{grid-row:span 2;align-self:stretch;justify-content:center;flex-direction:column;gap:4px;padding:0 6px;white-space:nowrap}
    .sizectl input[type=range]{width:70px}
    #tools::after{
      content:'';grid-row:span 2;position:sticky;right:0;width:18px;align-self:stretch;
      background:linear-gradient(to right, transparent, rgba(22,32,47,.92));
      pointer-events:none;
    }
    .hproj{width:120px;padding:10px}
    #status{right:8px;top:8px;padding:7px 9px;line-height:1.7;font-size:10px;min-width:0}
    #hint{display:block;max-width:none;left:8px;right:8px;bottom:8px;text-align:center;font-size:11px}
    #finishBar,#selBar{bottom:44px}
    #finishBar button,#selBar button{padding:12px 18px;font-size:14px}
    .brand small{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="badge"></div>
    <div><b>경비요도 제작</b><small>SECURITY DEPLOYMENT MAP</small></div>
  </div>
  <input id="projName" class="hproj" placeholder="프로젝트명 입력" maxlength="40">
  <div class="seg">
    <button id="modeMap" class="on">지도</button>
    <button id="modePhoto">사진</button>
  </div>
  <div class="seg" id="layerSeg">
    <button id="layerOsm" class="on">일반</button>
    <button id="layerSat">위성</button>
  </div>
  <button class="hbtn" id="btnPhoto">📁 GeoTIFF/사진 열기</button>
  <button class="hbtn warn" id="btnGeoClear" style="display:none">GeoTIFF 제거</button>
  <button class="hbtn" id="btnUndo">↩ 실행취소</button>
  <button class="hbtn" id="btnRedo">↪</button>
  <button class="hbtn primary" id="btnPng">PNG 저장</button>
  <button class="hbtn" id="btnJson">계획 저장</button>
  <button class="hbtn" id="btnOpen">계획 열기</button>
  <button class="hbtn warn" id="btnClear">전체 삭제</button>
  <input type="file" id="fileImg" accept="image/*,.tif,.tiff" hidden>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
</header>

<div id="main">
  <div id="tools">
    <button class="tool on" data-tool="pan"><span class="ic">✋</span>이동·확대</button>
    <button class="tool" data-tool="select"><span class="ic">🖱️</span>선택</button>
    <div class="tdiv"></div>
    <button class="tool" data-tool="officer"><span class="ic">
      <svg viewBox="0 0 32 32" width="22" height="22">
        <circle cx="16" cy="16" r="14" fill="#EEF1F5" stroke="#20242c" stroke-width="1.6"/>
        <clipPath id="clipGen"><circle cx="16" cy="16" r="14"/></clipPath>
        <g clip-path="url(#clipGen)">
          <polygon points="4,32 10,19 22,19 28,32" fill="#0054A6"/>
          <polygon points="16,19.5 14,23 18,23" fill="#1B2A41"/>
          <circle cx="16" cy="14" r="4.4" fill="#E8B98D"/>
          <path d="M11 12 A5 5 0 0 1 21 12 Z" fill="#1B2A41"/>
          <ellipse cx="16" cy="12.6" rx="5.2" ry="1.4" fill="#1B2A41"/>
          <circle cx="16" cy="11.3" r="0.9" fill="#F0B429"/>
        </g>
      </svg>
    </span>일반경찰</button>
    <button class="tool" data-tool="traffic"><span class="ic">
      <svg viewBox="0 0 32 32" width="22" height="22">
        <circle cx="16" cy="16" r="14" fill="#EEF1F5" stroke="#20242c" stroke-width="1.6"/>
        <clipPath id="clipTraf"><circle cx="16" cy="16" r="14"/></clipPath>
        <g clip-path="url(#clipTraf)">
          <polygon points="4,32 10,19 22,19 28,32" fill="#FFFFFF" stroke="#0054A6" stroke-width="1.2"/>
          <polygon points="16,19.5 14,23 18,23" fill="#1B2A41"/>
          <circle cx="16" cy="14" r="4.4" fill="#E8B98D"/>
          <path d="M11 12 A5 5 0 0 1 21 12 Z" fill="#1B2A41"/>
          <ellipse cx="16" cy="12.6" rx="5.2" ry="1.4" fill="#1B2A41"/>
          <circle cx="16" cy="11.3" r="0.9" fill="#F0B429"/>
        </g>
      </svg>
    </span>교통경찰</button>
    <button class="tool" data-tool="squad"><span class="ic">🛡️</span>부대</button>
    <div class="tdiv"></div>
    <button class="tool" data-tool="policeline"><span class="ic">🚧</span>질서유지선</button>
    <button class="tool" data-tool="bus"><span class="ic">🚌</span>경찰버스</button>
    <div class="tdiv"></div>
    <button class="tool" data-tool="arrow"><span class="ic">➡️</span>동선</button>
    <button class="tool" data-tool="pen"><span class="ic">／</span>직선</button>
    <button class="tool" data-tool="measureLine"><span class="ic">📏</span>거리측정</button>
    <button class="tool" data-tool="measureArea"><span class="ic">📐</span>면적측정</button>
    <button class="tool" data-tool="text"><span class="ic">🅣</span>텍스트</button>
    <button class="tool" data-tool="erase"><span class="ic">🧽</span>지우개</button>
    <div class="tdiv"></div>
    <div class="palette" id="palette"></div>
    <div class="tdiv"></div>
    <div class="sizectl">
      <span>크기·두께</span>
      <input type="range" id="sizeRange" min="0.5" max="3" step="0.1" value="1">
      <span id="sizeVal">×1.0</span>
    </div>
    <div class="sizectl" id="geoAlphaCtl" style="display:none">
      <span>GeoTIFF 투명</span>
      <input type="range" id="geoAlphaRange" min="0.1" max="1" step="0.05" value="1">
      <span id="geoAlphaVal">100%</span>
    </div>
    <div class="sizectl">
      <span>글자 배경</span>
      <input type="range" id="bgRange" min="0" max="1" step="0.05" value="0.55">
      <span id="bgVal">55%</span>
    </div>
    <div class="sizectl">
      <span>배경색</span>
      <div class="palette" id="bgPalette"></div>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="status"></div>
    <div id="hint">✋ 드래그로 이동, 휠/두 손가락으로 확대·축소</div>
    <div id="banner"></div>
    <div id="finishBar">
      <button id="finishDone">선 완료</button>
      <button id="finishCancel">취소</button>
    </div>
    <div id="selBar">
      <button id="selRename">이름 변경</button>
      <button id="selDelete">삭제</button>
    </div>
    <div id="txtBox">
      <textarea id="txtInput" rows="1"></textarea>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.21.0/dist/proj4.js"></script>

<script>
"use strict";

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let DPR = Math.max(1, window.devicePixelRatio || 1);

const state = {
  mode: 'map',
  baseLayer: 'osm',
  view: { x: 0, y: 0, scale: 1 },
  shapes: [],
  tool: 'pan',
  color: '#FF5A5F',
  selected: -1,
  draft: null,
  photo: null,
  photoURL: null,
  geoPhoto: null,
  geoAlpha: 1.0,
  squadUnit: 1, squadTeam: 1, officerNo: 0,
  size: 1,
  textBg: 0.55,
  textBgColor: '#000000',
  projName: '',
};
const undoStack = [], redoStack = [];

/* ── 지도 타일 ── */
const TILE = 256, MINZ = 3, MAXZ = 19;
const TILE_SOURCES = {
  osm: {
    url: (z, x, y) => 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png',
    attrib: '© OpenStreetMap contributors',
  },
  sat: {
    url: (z, x, y) => 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x,
    attrib: '© Esri, Maxar, Earthstar Geographics',
  },
};
const tileCache = new Map();
let tileFails = 0;
function tileImg(z, x, y) {
  const n = 1 << z;
  x = ((x % n) + n) % n;
  if (y < 0 || y >= n) return null;
  const src = TILE_SOURCES[state.baseLayer] || TILE_SOURCES.osm;
  const key = state.baseLayer + '/' + z + '/' + x + '/' + y;
  let t = tileCache.get(key);
  if (!t) {
    t = { img: new Image(), ok: false, err: false };
    t.img.crossOrigin = 'anonymous';
    t.img.onload = () => { t.ok = true; render(); };
    t.img.onerror = () => { t.err = true; if (++tileFails === 6) showBanner('지도 타일을 불러올 수 없습니다. 네트워크를 확인해 주세요.'); };
    t.img.src = src.url(z, x, y);
    if (tileCache.size > 500) tileCache.delete(tileCache.keys().next().value);
    tileCache.set(key, t);
  }
  return t;
}

function lonLatToWorld(lon, lat) {
  const x = (lon + 180) / 360 * TILE;
  const s = Math.sin(lat * Math.PI / 180);
  const y = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TILE;
  return { x, y };
}
function worldToLat(y) {
  const n = Math.PI - 2 * Math.PI * y / TILE;
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}
function metersPerWorld() {
  if (state.mode !== 'map') return 0;
  const midY = state.view.y + (stage.clientHeight / 2) / state.view.scale;
  return 40075016.686 / TILE * Math.cos(worldToLat(midY) * Math.PI / 180);
}

/* ── 좌표 변환 ── */
const w2sX = wx => (wx - state.view.x) * state.view.scale;
const w2sY = wy => (wy - state.view.y) * state.view.scale;
const s2wX = sx => sx / state.view.scale + state.view.x;
const s2wY = sy => sy / state.view.scale + state.view.y;

function setMapView(lon, lat, z) {
  const w = lonLatToWorld(lon, lat);
  state.view.scale = Math.pow(2, z);
  state.view.x = w.x - (stage.clientWidth / 2) / state.view.scale;
  state.view.y = w.y - (stage.clientHeight / 2) / state.view.scale;
}
function zoomAt(sx, sy, factor) {
  const min = state.mode === 'map' ? Math.pow(2, MINZ) : 0.02;
  const max = state.mode === 'map' ? Math.pow(2, MAXZ + 0.99) : 60;
  const ns = Math.min(max, Math.max(min, state.view.scale * factor));
  const wx = s2wX(sx), wy = s2wY(sy);
  state.view.scale = ns;
  state.view.x = wx - sx / ns;
  state.view.y = wy - sy / ns;
}

/* ── 실행취소 ── */
function pushUndo() {
  undoStack.push(JSON.stringify(state.shapes));
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  syncHeader();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state.shapes));
  state.shapes = JSON.parse(undoStack.pop());
  state.selected = -1; hideSelBar(); render(); syncHeader();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state.shapes));
  state.shapes = JSON.parse(redoStack.pop());
  state.selected = -1; hideSelBar(); render(); syncHeader();
}

/* ── 렌더링 ── */
function resize() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  cv.width = stage.clientWidth * DPR;
  cv.height = stage.clientHeight * DPR;
  render();
}
window.addEventListener('resize', resize);

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const W = stage.clientWidth, H = stage.clientHeight;
  ctx.clearRect(0, 0, W, H);
  drawBackground(ctx, W, H);
  for (let i = 0; i < state.shapes.length; i++) drawShape(ctx, state.shapes[i], i === state.selected);
  if (state.draft) drawDraft(ctx);
  updateStatus();
}

function drawBackground(g, W, H) {
  if (state.mode === 'photo') {
    g.fillStyle = '#1B222D'; g.fillRect(0, 0, W, H);
    if (state.photo) {
      g.imageSmoothingEnabled = true;
      g.drawImage(state.photo, w2sX(0), w2sY(0),
        state.photo.width * state.view.scale, state.photo.height * state.view.scale);
    } else {
      g.fillStyle = '#5b6b83'; g.font = '14px sans-serif'; g.textAlign = 'center';
      g.fillText('상단 [파일 열기]로 현장 사진을 불러오세요', W / 2, H / 2);
      g.textAlign = 'left';
    }
    return;
  }

  // 1. 지도 타일
  g.fillStyle = '#DDE3E9'; g.fillRect(0, 0, W, H);
  let z = Math.round(Math.log2(state.view.scale));
  z = Math.min(MAXZ, Math.max(MINZ, z));
  const f = state.view.scale / Math.pow(2, z);
  const wPerTile = TILE / Math.pow(2, z);
  const x0 = Math.floor(state.view.x / wPerTile);
  const y0 = Math.floor(state.view.y / wPerTile);
  const x1 = Math.floor((state.view.x + W / state.view.scale) / wPerTile);
  const y1 = Math.floor((state.view.y + H / state.view.scale) / wPerTile);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = tileImg(z, tx, ty);
    if (t && t.ok) {
      g.drawImage(t.img,
        Math.floor(w2sX(tx * wPerTile)), Math.floor(w2sY(ty * wPerTile)),

  const d = state.draft;
  if (d.pts.length === 0) return;
  const pts = d.cursor ? d.pts.concat([d.cursor]) : d.pts;
  if (d.kind === 'measureLine') { if (pts.length >= 2) drawMeasureLine(g, pts, false); }
  else if (d.kind === 'measureArea') { if (pts.length >= 2) drawMeasureArea(g, pts, false); }
  else if (pts.length >= 2) {
    if (d.kind === 'barrier') drawBarrier(g, pts, state.size);
    else if (d.kind === 'pen') {
      g.strokeStyle = state.color; g.lineWidth = 4 * state.size; g.lineCap = 'round'; g.lineJoin = 'round';
      pathPts(g, pts); g.stroke();
    } else drawTape(g, pts, state.size);
  }
  g.fillStyle = '#fff'; g.strokeStyle = '#111';
  for (const p of d.pts) {
    g.beginPath(); g.arc(w2sX(p.x), w2sY(p.y), 5, 0, Math.PI * 2); g.fill(); g.stroke();
  }
}

/* ── 상태 카드 ── */
function updateStatus() {
  let genOff = 0, trafOff = 0, squads = 0, buses = 0, lineLen = 0;
  const mpw = metersPerWorld();
  for (const s of state.shapes) {
    if (s.type === 'officer') { s.ptype === 'traffic' ? trafOff++ : genOff++; }
    else if (s.type === 'squad') squads++;
    else if (s.type === 'bus') buses++;
    else if (s.type === 'line' && s.kind !== 'barrier') {
      for (let i = 1; i < s.pts.length; i++)
        lineLen += Math.hypot(s.pts[i].x - s.pts[i - 1].x, s.pts[i].y - s.pts[i - 1].y);
    }
  }
  const fmt = L => state.mode === 'map'
    ? Math.round(L * mpw).toLocaleString() + ' m'
    : Math.round(L) + ' px';
  document.getElementById('status').innerHTML =
    '<span class="bl">●</span> 일반경찰 <b>' + genOff + '명</b><br>' +
    '<span style="color:#fff;-webkit-text-stroke:1px #0054A6">●</span> 교통경찰 <b>' + trafOff + '명</b><br>' +
    '<span class="bl">■</span> 부대 <b>' + squads + '개</b><br>' +
    '<span style="color:#2A2F36;-webkit-text-stroke:1px #fff">■</span> 경찰버스 <b>' + buses + '대</b><br>' +
    '<span class="yl">▬</span> 질서유지선 <b>' + fmt(lineLen) + '</b>';
}

/* ── 히트 테스트 ── */
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function hitTest(sx, sy) {
  for (let i = state.shapes.length - 1; i >= 0; i--) {
    const s = state.shapes[i];
    if (s.type === 'measure_area' && s.pts.length >= 3 && pointInPolyScreen(sx, sy, s.pts)) return i;
    if (s.type === 'officer' || s.type === 'squad' || s.type === 'bus') {
      const k = s.sz || 1;
      const r = s.type === 'squad' ? 36 * k : (s.type === 'bus' ? 34 * k : 20 * k);
      if (Math.hypot(sx - w2sX(s.x), sy - w2sY(s.y)) < r) return i;
    } else if (s.type === 'text') {
      const k = s.sz || 1;
      const fontPx = 14 * k, lineH = fontPx * 1.25;
      ctx.font = 'bold ' + fontPx + 'px sans-serif';
      const lines = textLines(s);
      let w = 0;
      for (const line of lines) w = Math.max(w, ctx.measureText(line).width);
      const bh = 16 * k + 6 * k + lineH * (lines.length - 1);
      const x = w2sX(s.x), y = w2sY(s.y);
      if (sx >= x - 8 * k && sx <= x + w + 8 * k && sy >= y - 16 * k && sy <= y - 16 * k + bh) return i;
    } else {
      const tol = Math.max(12, 8 * (s.w || 1) + 4);
      const pts = s.pts;
      for (let j = 1; j < pts.length; j++) {
        if (distToSeg(sx, sy, w2sX(pts[j-1].x), w2sY(pts[j-1].y), w2sX(pts[j].x), w2sY(pts[j].y)) < tol) return i;
      }
    }
  }
  return -1;
}

/* ── 포인터 입력 ── */
const pointers = new Map();
let gesture = null;
let lastTap = { t: 0, x: 0, y: 0 };

function evtPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  const p = evtPos(e);
  pointers.set(e.pointerId, p);
  if (txtBox.style.display !== 'none') commitTxt();

  if (pointers.size === 2) {
    const arr = [...pointers.values()];
    gesture = { type: 'pinch', d: Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y),
                cx: (arr[0].x + arr[1].x) / 2, cy: (arr[0].y + arr[1].y) / 2 };
    return;
  }
  const wx = s2wX(p.x), wy = s2wY(p.y);
  const t = state.tool;

  if (t === 'pan') { gesture = { type: 'pan', px: p.x, py: p.y }; return; }

  if (t === 'select') {
    if (state.selected >= 0 && state.shapes[state.selected].type === 'text') {
      const s = state.shapes[state.selected];
      const hp = textHandlePos(s);
      if (Math.hypot(p.x - hp.x, p.y - hp.y) < 22) {
        pushUndo();
        const d0 = Math.max(12, Math.hypot(p.x - w2sX(s.x), p.y - w2sY(s.y)));
        gesture = { type: 'tresize', d0, sz0: s.sz || 1 };
        return;
      }
    }
    const h = handleAt(p.x, p.y);
    if (h) {
      const s = state.shapes[state.selected];
      const now = Date.now();
      const isDbl = now - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 24;
      lastTap = { t: now, x: p.x, y: p.y };
      const minKeep = s.type === 'measure_area' ? 3 : 2;
      if (h.kind === 'v' && isDbl && (s.type === 'line' || s.type === 'pen' || s.type === 'measure_line' || s.type === 'measure_area') && s.pts.length > minKeep) {
        pushUndo(); s.pts.splice(h.idx, 1); render(); return;
      }
      pushUndo();
      if (h.kind === 'm') { s.pts.splice(h.idx, 0, { x: wx, y: wy }); gesture = { type: 'vertex', idx: h.idx }; }
      else gesture = { type: 'vertex', idx: h.idx };
      render(); return;
    }
    const hit = hitTest(p.x, p.y);
    const now2 = Date.now();
    const isDblSel = hit >= 0 && hit === state.selected &&
      now2 - lastTap.t < 400 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 26;
    lastTap = { t: now2, x: p.x, y: p.y };
    state.selected = hit;
    if (hit >= 0) {
      showSelBar();
      syncSizeUI(); syncBgUI(); syncBgColorUI();
      render();
      if (isDblSel) { renameSelected(); return; }
      pushUndo();
      gesture = { type: 'move', wx, wy };
    } else { hideSelBar(); syncSizeUI(); syncBgUI(); syncBgColorUI(); gesture = { type: 'pan', px: p.x, py: p.y }; }
    render(); return;
  }
  if (t === 'erase') {
    const hit = hitTest(p.x, p.y);
    if (hit >= 0) { pushUndo(); state.shapes.splice(hit, 1); render(); }
    return;
  }
  if (t === 'officer' || t === 'traffic') {
    pushUndo();
    state.officerNo++;
    state.shapes.push({ type: 'officer', x: wx, y: wy, label: '', sz: state.size, ptype: t === 'traffic' ? 'traffic' : 'general' });
    render(); return;
  }
  if (t === 'squad') {
    pushUndo();
    state.shapes.push({ type: 'squad', x: wx, y: wy, label: '제' + state.squadUnit + '기동대 ' + state.squadTeam + '팀', sz: state.size });
    state.squadTeam++;
    if (state.squadTeam > 8) { state.squadTeam = 1; state.squadUnit++; }
    render(); return;
  }
  if (t === 'bus') {
    pushUndo();
    state.shapes.push({ type: 'bus', x: wx, y: wy, label: '', sz: state.size });
    render(); return;
  }
  if (t === 'policeline') {
    const now = Date.now();
    const isDbl = now - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 24;
    lastTap = { t: now, x: p.x, y: p.y };
    if (!state.draft) { state.draft = { kind: 'police', pts: [{ x: wx, y: wy }] }; showFinishBar(); }
    else if (isDbl) { finishDraft(); return; }
    else state.draft.pts.push({ x: wx, y: wy });
    render(); return;
  }
  if (t === 'measureLine' || t === 'measureArea') {
    const now = Date.now();
    const isDbl = now - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 24;
    lastTap = { t: now, x: p.x, y: p.y };
    if (!state.draft) { state.draft = { kind: t, pts: [{ x: wx, y: wy }] }; showFinishBar(); }
    else if (isDbl) { finishDraft(); return; }
    else state.draft.pts.push({ x: wx, y: wy });
    render(); return;
  }
  if (t === 'arrow') { gesture = { type: 'arrow', a: { x: wx, y: wy }, b: { x: wx, y: wy } }; return; }
  if (t === 'pen') {
    const now = Date.now();
    const isDbl = now - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 24;
    lastTap = { t: now, x: p.x, y: p.y };
    if (!state.draft) { state.draft = { kind: 'pen', pts: [{ x: wx, y: wy }] }; showFinishBar(); }
    else if (isDbl) { finishDraft(); return; }
    else state.draft.pts.push({ x: wx, y: wy });
    render(); return;
  }
  if (t === 'text')  {
    showTxtBox(p.x, p.y, wx, wy, '', null, {
      center: true, multiline: true, sz: state.size,
      color: state.color, bg: state.textBg, bgColor: state.textBgColor,
    });
    return;
  }
});

cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) {
    if (state.draft && pointers.size === 0) {
      const p = evtPos(e);
      state.draft.cursor = { x: s2wX(p.x), y: s2wY(p.y) };
      render();
    }
    return;
  }
  const p = evtPos(e);
  pointers.set(e.pointerId, p);

  if (gesture && gesture.type === 'pinch' && pointers.size === 2) {
    const arr = [...pointers.values()];
    const d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    const cx = (arr[0].x + arr[1].x) / 2, cy = (arr[0].y + arr[1].y) / 2;
    if (gesture.d > 0) zoomAt(cx, cy, d / gesture.d);
    state.view.x -= (cx - gesture.cx) / state.view.scale;
    state.view.y -= (cy - gesture.cy) / state.view.scale;
    gesture.d = d; gesture.cx = cx; gesture.cy = cy;
    render(); return;
  }
  if (!gesture) return;

  if (gesture.type === 'pan') {
    state.view.x -= (p.x - gesture.px) / state.view.scale;
    state.view.y -= (p.y - gesture.py) / state.view.scale;
    gesture.px = p.x; gesture.py = p.y;
    render();
  } else if (gesture.type === 'tresize' && state.selected >= 0) {
    const s = state.shapes[state.selected];
    const d = Math.hypot(p.x - w2sX(s.x), p.y - w2sY(s.y));
    s.sz = Math.min(6, Math.max(0.3, gesture.sz0 * d / gesture.d0));
    syncSizeUI(); render();
  } else if (gesture.type === 'vertex' && state.selected >= 0) {
    const s = state.shapes[state.selected];
    const pts = editablePts(s);
    if (pts && pts[gesture.idx]) {
      pts[gesture.idx].x = s2wX(p.x);
      pts[gesture.idx].y = s2wY(p.y);
      render();
    }
  } else if (gesture.type === 'move' && state.selected >= 0) {
    const wx = s2wX(p.x), wy = s2wY(p.y);
    const dx = wx - gesture.wx, dy = wy - gesture.wy;
    gesture.wx = wx; gesture.wy = wy;
    const s = state.shapes[state.selected];
    if (s.pts) for (const q of s.pts) { q.x += dx; q.y += dy; }
    else { s.x += dx; s.y += dy; }
    positionSelBar(); render();
  } else if (gesture.type === 'arrow') {
    gesture.b = { x: s2wX(p.x), y: s2wY(p.y) };
    render();
    drawArrowShape(ctx, gesture.a, gesture.b, state.color, state.size);
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (gesture) {
    if (gesture.type === 'arrow') {
      const L = Math.hypot(gesture.b.x - gesture.a.x, gesture.b.y - gesture.a.y) * state.view.scale;
      if (L > 12) { pushUndo(); state.shapes.push({ type: 'arrow', pts: [gesture.a, gesture.b], color: state.color, w: state.size }); }
    }
    if (pointers.size === 0) gesture = null;
    else if (pointers.size === 1 && gesture.type === 'pinch') {
      const rest = [...pointers.values()][0];
      gesture = { type: 'pan', px: rest.x, py: rest.y };
    }
    render();
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const p = evtPos(e);
  zoomAt(p.x, p.y, Math.pow(1.0016, -e.deltaY));
  render();
}, { passive: false });

/* ── 선 완료 바 ── */
const finishBar = document.getElementById('finishBar');
function showFinishBar() { finishBar.style.display = 'flex'; }
function hideFinishBar() { finishBar.style.display = 'none'; }
function finishDraft() {
  const d = state.draft;
  if (d) {
    if (d.kind === 'pen' && d.pts.length >= 2) {
      pushUndo();
      state.shapes.push({ type: 'pen', pts: d.pts, color: state.color, w: state.size });
    } else if (d.kind === 'measureLine' && d.pts.length >= 2) {
      pushUndo();
      state.shapes.push({ type: 'measure_line', pts: d.pts });
    } else if (d.kind === 'measureArea' && d.pts.length >= 3) {
      pushUndo();
      state.shapes.push({ type: 'measure_area', pts: d.pts });
    } else if (d.kind === 'police' && d.pts.length >= 2) {
      pushUndo();
      state.shapes.push({ type: 'line', kind: 'police', pts: d.pts, w: state.size });
    }
  }
  state.draft = null; hideFinishBar(); render();
}
document.getElementById('finishDone').onclick = finishDraft;

const selBar = document.getElementById('selBar');
function showSelBar() { selBar.style.display = 'flex'; }
function hideSelBar() { selBar.style.display = 'none'; }
function positionSelBar() {}

function renameSelected() {
  if (state.selected < 0) return;

  if (!(s.type === 'squad' || s.type === 'officer' || s.type === 'bus' || s.type === 'text')) return;

}

/* ── 텍스트 입력 팝업 ── */
const txtBox = document.getElementById('txtBox');
const txtInput = document.getElementById('txtInput');
let txtCb = null, txtClosing = true;
function autoSizeTxtInput() {
  const k = parseFloat(txtInput.dataset.scale || '1');
  const fontPx = Math.max(10, 14 * k);
  txtInput.style.fontSize = fontPx + 'px';
  ctx.font = 'bold ' + fontPx + 'px sans-serif';
  const lines = txtInput.value.split('\n');
  let maxW = 30;
  for (const line of lines) maxW = Math.max(maxW, ctx.measureText(line || ' ').width);
  txtInput.style.width = Math.min(420, maxW + 12) + 'px';
  txtInput.style.height = 'auto';
  txtInput.style.height = txtInput.scrollHeight + 'px';
}
function showTxtBox(sx, sy, wx, wy, initial, cb, opts) {
  opts = opts || {};
  const k = opts.sz != null ? opts.sz : 1;
  txtClosing = false;
  txtBox.style.display = 'block';
  txtInput.dataset.scale = k;
  txtInput.dataset.multiline = opts.multiline ? '1' : '0';
  txtInput.style.color = opts.color || '#FFD023';
  const alpha = opts.bg != null ? opts.bg : 0;
  txtInput.style.background = alpha > 0.01 ? hexToRgba(opts.bgColor || '#000000', alpha) : 'transparent';
  txtInput.value = initial || '';
  autoSizeTxtInput();
  const boxW = parseFloat(txtInput.style.width), boxH = parseFloat(txtInput.style.height);
  let left = sx, top = sy;
  if (opts.center) { left = sx - boxW / 2; top = sy - boxH * 0.72; }
  else top = sy - boxH;
  left = Math.max(4, Math.min(left, stage.clientWidth - boxW - 4));
  top = Math.max(4, Math.min(top, stage.clientHeight - boxH - 4));
  txtBox.style.left = left + 'px';
  txtBox.style.top = top + 'px';
  txtCb = cb || (val => {
    pushUndo();
    state.shapes.push({ type: 'text', x: wx, y: wy, text: val, color: state.color, sz: state.size, bg: state.textBg, bgColor: state.textBgColor });
    render();
  });
  setTimeout(() => { txtInput.focus(); if (initial) txtInput.select(); }, 30);
}
function hideTxtBox() { txtBox.style.display = 'none'; }
function commitTxt() {
  if (txtClosing) return;
  txtClosing = true;
  const v = txtInput.value.replace(/\n+$/, '');
  hideTxtBox();
  if (v.trim() && txtCb) txtCb(v);
  txtCb = null;
}
function cancelTxt() {
  if (txtClosing) return;
  txtClosing = true;
  hideTxtBox();
  txtCb = null;
}
txtInput.addEventListener('input', autoSizeTxtInput);
txtInput.addEventListener('blur', () => commitTxt());
txtInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); cancelTxt(); txtInput.blur(); }
  else if (e.key === 'Enter') {
    const multi = txtInput.dataset.multiline === '1';
    if (!multi || e.ctrlKey || e.metaKey) { e.preventDefault(); txtInput.blur(); }
  }
});

/* ─────────────────────────────────────────────────────────────
   GeoTIFF & 한국 좌표계 변환 엔진 (Proj4 & GeoTIFF.js)
───────────────────────────────────────────────────────────── */
const KOREA_PROJ4_DEFS = {
  3857: '+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +wktext +no_defs',
  4326: '+proj=longlat +datum=WGS84 +no_defs',
  5174: '+proj=tmerc +lat_0=38 +lon_0=127.0028902777778 +k=1 +x_0=200000 +y_0=500000 +ellps=bessel +units=m +towgs84=-115.80,474.99,674.11,1.16,-2.31,-1.63,6.43 +no_defs',
  5178: '+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 +x_0=1000000 +y_0=2000000 +ellps=bessel +towgs84=-145.907,505.034,685.756,-1.162,2.347,1.592,6.342 +units=m +no_defs',
  5179: '+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 +x_0=1000000 +y_0=2000000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
  5181: '+proj=tmerc +lat_0=38 +lon_0=127 +k=1 +x_0=200000 +y_0=500000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
  5185: '+proj=tmerc +lat_0=38 +lon_0=125 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
  5186: '+proj=tmerc +lat_0=38 +lon_0=127 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
  5187: '+proj=tmerc +lat_0=38 +lon_0=129 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
  5188: '+proj=tmerc +lat_0=38 +lon_0=131 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs',
  32651: '+proj=utm +zone=51 +datum=WGS84 +units=m +no_defs',
  32652: '+proj=utm +zone=52 +datum=WGS84 +units=m +no_defs',
};

if (typeof proj4 !== 'undefined') {
  for (const [epsg, def] of Object.entries(KOREA_PROJ4_DEFS)) {
    proj4.defs('EPSG:' + epsg, def);
  }
}

function geoToLonLat(epsg, x, y) {
  if (epsg === 4326) return { lon: x, lat: y };
  if (typeof proj4 === 'undefined') return null;
  const key = 'EPSG:' + epsg;
  try {
    const r = proj4(key, 'EPSG:4326', [x, y]);
    if (!r || !isFinite(r[0]) || !isFinite(r[1])) return null;
    return { lon: r[0], lat: r[1] };
  } catch (e) { return null; }
}

function guessKoreanEPSG(minX, minY, maxX, maxY) {
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  if (cx >= 124 && cx <= 132 && cy >= 33 && cy <= 39) return 4326;
  if (cx >= 700000 && cx <= 1300000 && cy >= 1500000 && cy <= 2200000) return 5179;
  if (cx >= 100000 && cx <= 350000 && cy >= 400000 && cy <= 750000) return 5186;
  if (cx >= 100000 && cx <= 350000 && cy >= 300000 && cy <= 450000) return 5174;
  if (cx >= 300000 && cx <= 650000 && cy >= 3500000 && cy <= 4300000) return 32652;
  if (cx >= 13000000 && cx <= 15000000 && cy >= 3800000 && cy <= 4800000) return 3857;
  return null;
}

function placeGeoImage(canvas, bbox, epsg) {
  const [minX, minY, maxX, maxY] = bbox;
  const llTL = geoToLonLat(epsg, minX, maxY);
  const llBR = geoToLonLat(epsg, maxX, minY);

  if (!llTL || !llBR) {
    showBanner('좌표계(EPSG:' + epsg + ') 변환에 실패하여 일반 사진으로 불러옵니다.');
    loadPhoto(canvas.toDataURL('image/png'));
    return;
  }

  const wTL = lonLatToWorld(llTL.lon, llTL.lat);
  const wBR = lonLatToWorld(llBR.lon, llBR.lat);

  state.geoPhoto = { canvas, wx0: wTL.x, wy0: wTL.y, wx1: wBR.x, wy1: wBR.y };
  document.getElementById('btnGeoClear').style.display = '';
  document.getElementById('geoAlphaCtl').style.display = '';

  if (state.mode !== 'map') setMode('map');

  fitToGeoPhoto();
  showBanner('GeoTIFF(EPSG:' + epsg + ')를 실제 지도 위에 정확히 배치했습니다.');
  render();
}

function fitToGeoPhoto() {
  const gp = state.geoPhoto; if (!gp) return;
  const w = Math.abs(gp.wx1 - gp.wx0), h = Math.abs(gp.wy1 - gp.wy0);
  if (!w || !h) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.min(W / w, H / h) * 0.92;
  state.view.scale = s;
  const cx = (gp.wx0 + gp.wx1) / 2, cy = (gp.wy0 + gp.wy1) / 2;
  state.view.x = cx - (W / 2) / s;
  state.view.y = cy - (H / 2) / s;
}

document.getElementById('btnGeoClear').onclick = () => {
  state.geoPhoto = null;
  document.getElementById('btnGeoClear').style.display = 'none';
  document.getElementById('geoAlphaCtl').style.display = 'none';
  render();
};

function isTiffFile(f) {
  return /\.tiff?$/i.test(f.name || '') || f.type === 'image/tiff' || f.type === 'image/tif';
}

function openImageFile(f) {

/* ─────────────────────────────────────────────────────────────
   GeoTIFF 무결점 독립 밴드 디코더 (R/G/B 채널 간섭 및 왜곡 완전 제거)
───────────────────────────────────────────────────────────── */
async function loadGeoTiffFile(file) {
  if (typeof GeoTIFF === 'undefined') {
    showBanner('GeoTIFF 엔진을 로드하지 못했습니다.');
    return;
  }
  showBanner('GeoTIFF 영상을 실제 색상으로 불러오는 중입니다…');

  try {
    const arrayBuffer = await file.arrayBuffer();
    const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
    const image = await tiff.getImage();

    const width = image.getWidth();
    const height = image.getHeight();
    const bbox = image.getBoundingBox();
    const geoKeys = image.getGeoKeys() || {};
    const samplesPerPixel = image.getSamplesPerPixel() || 3;

    let epsg = geoKeys.ProjectedCSTypeGeoKey || geoKeys.GeographicTypeGeoKey || geoKeys.ProjectionGeoKey;
    if (!epsg || epsg === 32767 || !KOREA_PROJ4_DEFS[epsg]) {
      epsg = guessKoreanEPSG(bbox[0], bbox[1], bbox[2], bbox[3]);
    }

    const totalPixels = width * height;

    // 밴드를 개별 플랫 버퍼로 직접 추출 (채널 꼬임 원천 차단)
    const rasters = await image.readRasters();
    
    let rBand, gBand, bBand, aBand = null;

    if (rasters[0] && (rasters[0].length !== undefined)) {
      // rasters = [band0, band1, band2, ...]
      rBand = rasters[0];
      gBand = rasters.length > 1 ? rasters[1] : rasters[0];
      bBand = rasters.length > 2 ? rasters[2] : rasters[0];
      if (rasters.length >= 4) aBand = rasters[3];
    } else {
      // 1차원 인터리브 버퍼인 경우
      const numB = samplesPerPixel || 3;
      rBand = new rasters.constructor(totalPixels);
      gBand = new rasters.constructor(totalPixels);
      bBand = new rasters.constructor(totalPixels);
      if (numB >= 4) aBand = new rasters.constructor(totalPixels);
      for (let p = 0; p < totalPixels; p++) {
        rBand[p] = rasters[p * numB];
        gBand[p] = numB > 1 ? rasters[p * numB + 1] : rasters[p * numB];
        bBand[p] = numB > 2 ? rasters[p * numB + 2] : rasters[p * numB];
        if (numB >= 4) aBand[p] = rasters[p * numB + 3];
      }
    }

    // 비트 심도 및 TypedArray 형식 확인
    const bps = image.getBitsPerSample();
    const bits = Array.isArray(bps) ? bps[0] : (bps || 8);

    const is8Bit = bits === 8 || rBand instanceof Uint8Array || rBand instanceof Uint8ClampedArray;
    const is16Bit = bits === 16 || rBand instanceof Uint16Array || rBand instanceof Int16Array;

    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = width;
    srcCanvas.height = height;
    const srcCtx = srcCanvas.getContext('2d');
    const imgData = srcCtx.createImageData(width, height);
    const data = imgData.data;

    if (is8Bit) {
      // 8비트 표준 정사영상 (1:1 무손실 다이렉트 렌더링)
      for (let p = 0, j = 0; p < totalPixels; p++, j += 4) {
        const r = rBand[p] & 0xFF;
        const g = gBand[p] & 0xFF;
        const b = bBand[p] & 0xFF;

        if (r === 0 && g === 0 && b === 0) {
          data[j + 3] = 0;
          continue;
        }

        data[j] = r;
        data[j + 1] = g;
        data[j + 2] = b;
        data[j + 3] = 255;
      }
    } else if (is16Bit) {
      // 16비트 정사영상 (비트 쉬프트 기반 안전 하이라이트 보존)
      let maxVal = 0;
      const step = Math.max(1, Math.floor(totalPixels / 10000));
      for (let i = 0; i < totalPixels; i += step) {
        const v = Math.max(rBand[i] || 0, gBand[i] || 0, bBand[i] || 0);
        if (v > maxVal && v < 65535) maxVal = v;
      }
      let shift = 8;
      if (maxVal > 0 && maxVal <= 1023) shift = 2;       // 10비트
      else if (maxVal > 0 && maxVal <= 4095) shift = 4;  // 12비트
      else shift = 8;                                    // 16비트

      for (let p = 0, j = 0; p < totalPixels; p++, j += 4) {
        const rawR = rBand[p] || 0;
        const rawG = gBand[p] || 0;
        const rawB = bBand[p] || 0;

        if (rawR === 0 && rawG === 0 && rawB === 0) {
          data[j + 3] = 0;
          continue;
        }

        data[j] = Math.min(255, Math.max(0, rawR >> shift));
        data[j + 1] = Math.min(255, Math.max(0, rawG >> shift));
        data[j + 2] = Math.min(255, Math.max(0, rawB >> shift));
        data[j + 3] = 255;
      }
    } else {
      // Float32 등 부동소수점 정사영상
      let minV = Infinity, maxV = -Infinity;
      const step = Math.max(1, Math.floor(totalPixels / 10000));
      for (let i = 0; i < totalPixels; i += step) {
        const v = rBand[i];
        if (isFinite(v)) {
          if (v < minV) minV = v;
          if (v > maxV) maxV = v;
        }
      }
      const range = (maxV - minV) || 1;
      for (let p = 0, j = 0; p < totalPixels; p++, j += 4) {
        const rawR = rBand[p] || 0;
        const rawG = gBand[p] || 0;
        const rawB = bBand[p] || 0;

        if (!isFinite(rawR) || (rawR === 0 && rawG === 0 && rawB === 0)) {
          data[j + 3] = 0;
          continue;
        }

        data[j] = Math.min(255, Math.max(0, Math.round((rawR - minV) / range * 255)));
        data[j + 1] = Math.min(255, Math.max(0, Math.round((rawG - minV) / range * 255)));
        data[j + 2] = Math.min(255, Math.max(0, Math.round((rawB - minV) / range * 255)));
        data[j + 3] = 255;
      }
    }

    srcCtx.putImageData(imgData, 0, 0);

    // 대용량 리사이즈 안전장치 (최대 2500만 화소)
    const MAX_PX = 25e6;
    let outW = width, outH = height;
    if (width * height > MAX_PX) {
      const s = Math.sqrt(MAX_PX / (width * height));
      outW = Math.max(1, Math.round(width * s));
      outH = Math.max(1, Math.round(height * s));
    }
    const outCanvas = document.createElement('canvas');
    outCanvas.width = outW;
    outCanvas.height = outH;
    outCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, outW, outH);

    if (bbox && epsg && KOREA_PROJ4_DEFS[epsg]) {
      placeGeoImage(outCanvas, bbox, epsg);
    } else {
      showBanner('지리 좌표를 인식하지 못해 일반 사진으로 불러옵니다.');
      loadPhoto(outCanvas.toDataURL('image/png'));
    }
  } catch (err) {
    console.error(err);
    showBanner('GeoTIFF 처리 실패: ' + err.message);
  }
}

function loadPhoto(dataURL) {
  const img = new Image();
  img.onload = () => {
    state.photo = img; state.photoURL = dataURL;
    if (state.mode !== 'photo') setMode('photo'); else { fitPhoto(); render(); }
  };
  img.src = dataURL;
}
function fitPhoto() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.min(W / state.photo.width, H / state.photo.height) * 0.96;
  state.view.scale = s;
  state.view.x = -(W / s - state.photo.width) / 2;
  state.view.y = -(H / s - state.photo.height) / 2;
}

    } : null,
  };
  const b = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = (state.projName || '경력배치계획') + '_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};

document.getElementById('btnOpen').onclick = () => document.getElementById('fileJson').click();
document.getElementById('fileJson').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (d.app !== 'deployment-planner') throw 0;
      pushUndo();
      state.shapes = d.shapes || [];
      state.squadUnit = d.squadUnit || 1;
      state.squadTeam = d.squadTeam || 1;
      state.view = d.view || state.view;
      state.projName = d.name || '';
      projInput.value = state.projName;
      document.title = state.projName ? state.projName + ' · 경비요도 제작' : '경비요도 제작';
      if (d.photoURL) loadPhoto(d.photoURL);
      else setMode(d.mode || 'map');
      if (d.geoPhoto && d.geoPhoto.dataURL) {
        const gimg = new Image();
        gimg.onload = () => {
          const c = document.createElement('canvas');
          c.width = gimg.width; c.height = gimg.height;
          c.getContext('2d').drawImage(gimg, 0, 0);
          state.geoPhoto = { canvas: c, wx0: d.geoPhoto.wx0, wy0: d.geoPhoto.wy0, wx1: d.geoPhoto.wx1, wy1: d.geoPhoto.wy1 };
          document.getElementById('btnGeoClear').style.display = '';
          document.getElementById('geoAlphaCtl').style.display = '';
          render();
        };
        gimg.src = d.geoPhoto.dataURL;
      } else {
        state.geoPhoto = null;
        document.getElementById('btnGeoClear').style.display = 'none';
        document.getElementById('geoAlphaCtl').style.display = 'none';
      }
      render();
    } catch { showBanner('계획 파일을 읽을 수 없습니다.'); }
  };
  rd.readAsText(f);
  e.target.value = '';
});

/* ── 시작 ── */
resize();
setMode('map');
syncHeader();
syncSizeUI();
syncBgUI();
syncBgColorUI();
</script>
